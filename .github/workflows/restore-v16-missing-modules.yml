name: Restore exact v1.6 core modules

on:
  push:
    paths:
      - 'recovery/restore3.tgz'
      - '.github/workflows/restore-v16-missing-modules.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact v1.6 modules
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf recovery/restore3.tgz
          echo "a2e1f2399e404e7ee109e23becc7dd086ce46c4c3fcff3405af08729e0bc40ee  abtem_ase_workbench/backend.py" | sha256sum -c -
          echo "d30ce2fdd285fc22b44dea913d8d3f2bbfd0c2c47040c9fe33bdea9707a1426a  abtem_ase_workbench/gui.py" | sha256sum -c -
          echo "5724d26dee852b65965e80c2a6d6c90380e9680dc735f68d739e9b03c34b307f  abtem_ase_workbench/database_2d.py" | sha256sum -c -

      - name: Commit restored modules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f recovery/restore3.tgz
          rm -f .github/workflows/restore-v16-missing-modules.yml
          rmdir recovery 2>/dev/null || true
          git add -A
          git commit -m "Restore exact v1.6 core modules"
          git push
