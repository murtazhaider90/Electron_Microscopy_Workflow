name: Windows distribution
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install controlled CPU build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/windows/constraints.txt ".[desktop,windows-build,dev]"
          python -m pip check
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - name: Scientific regression tests
        run: python -m pytest --run-slow
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 --yes --no-progress
      - name: Bundle, smoke test, install, uninstall and generate artifacts
        run: python packaging/windows/build.py
      - name: Upload release artifacts and acceptance reports
        uses: actions/upload-artifact@v4
        with:
          name: ElectronMicroscopyWorkbench-windows-x64
          path: release/
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build/ElectronMicroscopyWorkbench/warn-*.txt
            release/**/*.log
            release/**/*.json
            ~/AppData/Local/ElectronMicroscopyWorkbench/Logs/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ElectronMicroscopyWorkbench-windows-x64
          path: release
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Electron Microscopy Workbench $RELEASE_TAG" --generate-notes
          find release -type f \( -name '*.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' -o -name 'dependencies.txt' \) -exec gh release upload "$RELEASE_TAG" {} +
